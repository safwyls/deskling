# Builds the firmware (every companion in one), the Android app and the desktop app (on Windows, macOS and Linux),
# assembles the website around them and publishes it to GitHub Pages.
# Pages has to be switched on once: Settings > Pages > Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'firmware/**'
      - 'app/**'
      - 'desktop/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a new push waits for the running build instead of cancelling it; if several pile up, only the newest runs next
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The desktop app, built natively on each system. A failure here doesn't hold the site back: the page then
  # offers whatever installers did build.
  desktop:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04          # the oldest supported Ubuntu, so the AppImage runs on as many systems as possible
            args: --bundles deb,appimage
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest          # one download for Apple silicon and Intel Macs
            args: --target universal-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci
      - run: npm test
      - run: npm run build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/**/bundle/**/*.exe
            desktop/src-tauri/target/**/bundle/**/*.dmg
            desktop/src-tauri/target/**/bundle/**/*.AppImage
            desktop/src-tauri/target/**/bundle/**/*.deb

  build:
    needs: desktop
    runs-on: ubuntu-latest
    env:
      # the app is only published when its signing key is set up (Settings > Secrets and variables > Actions)
      HAS_APP_KEY: ${{ secrets.DESKLING_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build the firmware
        working-directory: firmware
        run: pio run

      - uses: actions/setup-java@v4
        if: env.HAS_APP_KEY == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build the Android app
        if: env.HAS_APP_KEY == 'true'
        env:
          DESKLING_KEYSTORE_B64: ${{ secrets.DESKLING_KEYSTORE_B64 }}
          DESKLING_KEYSTORE: ${{ runner.temp }}/deskling.jks
          DESKLING_KEYSTORE_PASSWORD: ${{ secrets.DESKLING_KEYSTORE_PASSWORD }}
          DESKLING_KEY_ALIAS: ${{ secrets.DESKLING_KEY_ALIAS }}
          DESKLING_KEY_PASSWORD: ${{ secrets.DESKLING_KEY_PASSWORD }}
        run: |
          echo "$DESKLING_KEYSTORE_B64" | base64 -d > "$DESKLING_KEYSTORE"
          cd app && ./gradlew --no-daemon :app:assembleRelease
          cd .. && python3 site/tools/app_to_site.py app/app/build/outputs/apk/release site/app
          rm "$DESKLING_KEYSTORE"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: desktop-*
          path: desktop-dist
          merge-multiple: true

      - name: Assemble the site
        run: |
          mkdir -p desktop-dist
          python3 site/tools/desktop_to_site.py desktop-dist site/desktop desktop/src-tauri/tauri.conf.json
          python3 site/tools/firmware_to_site.py firmware site/fw
          python3 site/tools/pack_pets.py app/app/src/main/assets/pets site/pets
          rm -rf site/js/src site/tools site/package.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
