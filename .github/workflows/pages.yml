# Builds the three firmwares, assembles the website around them and publishes it to GitHub Pages.
# Pages has to be switched on once: Settings > Pages > Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'firmware/**'
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the app is only published when its signing key is set up (Settings > Secrets and variables > Actions)
      HAS_APP_KEY: ${{ secrets.DESKLING_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build the firmware for each companion
        working-directory: firmware
        run: pio run -e wisp -e crumb -e sprig

      - uses: actions/setup-java@v4
        if: env.HAS_APP_KEY == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build the Android app
        if: env.HAS_APP_KEY == 'true'
        env:
          DESKLING_KEYSTORE_B64: ${{ secrets.DESKLING_KEYSTORE_B64 }}
          DESKLING_KEYSTORE: ${{ runner.temp }}/deskling.jks
          DESKLING_KEYSTORE_PASSWORD: ${{ secrets.DESKLING_KEYSTORE_PASSWORD }}
          DESKLING_KEY_ALIAS: ${{ secrets.DESKLING_KEY_ALIAS }}
          DESKLING_KEY_PASSWORD: ${{ secrets.DESKLING_KEY_PASSWORD }}
        run: |
          echo "$DESKLING_KEYSTORE_B64" | base64 -d > "$DESKLING_KEYSTORE"
          cd app && ./gradlew --no-daemon :app:assembleRelease
          cd .. && python3 site/tools/app_to_site.py app/app/build/outputs/apk/release site/app
          rm "$DESKLING_KEYSTORE"

      - name: Assemble the site
        run: |
          python3 site/tools/firmware_to_site.py firmware site/fw
          python3 site/tools/pack_pets.py app/app/src/main/assets/pets site/pets
          rm -rf site/js/src site/tools site/package.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
