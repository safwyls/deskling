; Deskling firmware for the Elecrow CrowPanel 1.46" rotary display (ESP32-S3R8, 16 MB flash, 8 MB octal PSRAM)
;
; Libraries are vendored in lib/ at the versions Elecrow's own Core 3 + LVGL 9 example uses
; (LovyanGFX 1.2.7 with the board's ST77961 panel driver, LVGL 9.1.0), so nothing is fetched at build time.

; One firmware with every companion in it (src/companion.cpp); the dial shows the one chosen in its settings.
;   pio run
[platformio]
default_envs = deskling

[env:deskling]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi   ; confirmed booting on hardware (DIO header from the bootloader)
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

build_flags =
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
